<div class="dashboard-container">
  <h1>{{ 'TRANSACTION_DASHBOARD' | translate }}</h1>

  <!-- Transaction Selection -->
  <div class="transaction-selection">
    <label>{{ 'SELECT_MONTH' | translate }}:</label>
    <select [(ngModel)]="selectedMonth">
      <option *ngFor="let month of months" [value]="month.value">{{ month.name }}</option>
    </select>

    <label>{{ 'SELECT_YEAR' | translate }}:</label>
    <select [(ngModel)]="selectedYear">
      <option *ngFor="let year of years" [value]="year">{{ year }}</option>
    </select>

    <button (click)="loadMonthlyData()">{{ 'SHOW_DATA' | translate }}</button>
  </div>

  <!-- Transaction Type Count Bar Chart -->
  <div class="chart-section">
    <h2>{{ 'TRANSACTION_COUNT_BY_TYPE' | translate }}</h2>
    <ngx-charts-bar-vertical
      [view]="view"
      [scheme]="'vivid'"
      [results]="transactionTypeData"
      [gradient]="false"
      [xAxis]="true"
      [yAxis]="true"
      [legend]="showLegend"
      [showXAxisLabel]="true"
      [showYAxisLabel]="true"
      xAxisLabel="{{ 'TRANSACTION_TYPE' | translate }}"
      yAxisLabel="{{ 'COUNT' | translate }}"
      [animations]="animations">
    </ngx-charts-bar-vertical>
  </div>

  <!-- Transaction Amount Pie Chart -->
  <div class="chart-section">
    <h2>{{ 'TOTAL_TRANSACTION_AMOUNT_BY_TYPE' | translate }}</h2>
    <ngx-charts-pie-chart
      [view]="view"
      [scheme]="'cool'"
      [results]="transactionAmountData"
      [legend]="showLegend"
      [labels]="showLabels"
      [doughnut]="false"
      [animations]="animations">
    </ngx-charts-pie-chart>
  </div>

  <!-- Monthly Transaction Bar Chart -->
  <div class="chart-section">
    <h2>{{ 'MONTHLY_TRANSACTION_CHART' | translate }}</h2>
    <div *ngIf="monthlyTransactionData.length">
      <ngx-charts-bar-vertical
        [view]="view"
        [scheme]="'flame'"
        [results]="monthlyTransactionData"
        [gradient]="false"
        [xAxis]="true"
        [yAxis]="true"
        [legend]="showLegend"
        [showXAxisLabel]="true"
        [showYAxisLabel]="true"
        xAxisLabel="{{ 'DAY_OF_MONTH' | translate }}"
        yAxisLabel="{{ 'TOTAL_PRICE' | translate }}"
        [animations]="animations">
      </ngx-charts-bar-vertical>
    </div>
  </div>
</div>
